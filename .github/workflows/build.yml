name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 单元测试：每次 push / PR 都跑，快
  # ---------------------------------------------------------------
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 执行单元测试
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 7

  # ---------------------------------------------------------------
  # 构建 APK：debug 每次出，release 需打 tag 且有签名密钥
  # ---------------------------------------------------------------
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION"

      # ---------- Debug ----------
      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 归档 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LPdf-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ---------- Release（仅 tag） ----------
      - name: 还原签名密钥库
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，release 将产出未签名包"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/lpdf-release.jks
          ls -l keystore/

      - name: 构建 Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LPdf_KEYSTORE_PATH: keystore/lpdf-release.jks
          LPdf_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LPdf_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LPdf_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 归档 Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LPdf-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
